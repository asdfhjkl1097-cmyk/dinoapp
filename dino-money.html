<style>

.stage{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.bubble{background:#fff;border-radius:18px;padding:8px 14px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative;margin-bottom:10px;text-align:center}

.row:last-child{border:0}
.ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#e6deff,#d2f7f2);margin-right:10px}
.l{display:flex;align-items:center}.l small{display:block;opacity:.6}
.pos{color:var(--inc);font-weight:800}.neg{color:var(--exp);font-weight:800}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mnav button{border:0;width:40px;height:40px;border-radius:14px;background:#fff;font-size:18px;color:var(--ink)}
.bar{height:14px;border-radius:9px;background:#0001;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g1),var(--g2))}

nav .plus{width:58px;height:58px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:34px;box-shadow:0 6px 16px rgba(124,92,255,.5);justify-content:center;padding:0}

.sheet>div{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:#eee9ff;border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:800;background:none;font-family:inherit;color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
input[type=number],input[type=text],select{width:100%;padding:13px;border-radius:14px;border:2px solid #e6deff;font-size:18px;margin-bottom:10px;font-family:inherit;color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats button{border:2px solid #e6deff;background:#fff;border-radius:14px;padding:7px 10px;font-family:inherit;font-weight:700;color:var(--ink)}

.go{width:100%;border:0;border-radius:18px;padding:15px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));font-family:inherit}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;border:0;padding:12px;border-radius:14px;font-weight:800;background:#fff;font-family:inherit;color:var(--ink)}
.chips button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.empty{text-align:center;opacity:.6;padding:18px}
body{background:radial-gradient(circle at 15% 12%,#fff 0,#fff0 18%),radial-gradient(circle at 90% 70%,#ffe9a8 0,#ffe9a800 30%),linear-gradient(160deg,#c3b5ff 0%,#a9ece3 55%,#fff1c2 100%)}
.stage{perspective:700px}

.stage:after{content:"";width:170px;height:22px;border-radius:50%;background:radial-gradient(#3b2a6b55,#3b2a6b00 70%);margin-top:-16px}
.card{background:linear-gradient(145deg,#fff,#ece6ff);border:1px solid #fff;box-shadow:0 8px 0 -1px #cbbfff,0 18px 26px rgba(80,60,160,.25),inset 0 2px 0 #fff}
.top{padding-bottom:10px}
.top .i{background:linear-gradient(160deg,#58e0a6,#16a574 60%,#34d3c5);box-shadow:0 8px 0 #0f7d57,0 18px 24px rgba(15,125,87,.35),inset 0 3px 5px rgba(255,255,255,.55)}

.bubble{background:linear-gradient(#fff,#f1ecff);box-shadow:0 5px 0 #d6ccff,0 12px 18px rgba(80,60,160,.2)}
.ic{background:linear-gradient(145deg,#f3eeff,#cdf6f0);box-shadow:0 4px 0 #b9ade8,inset 0 2px 0 #fff}
.bar{box-shadow:inset 0 3px 5px rgba(60,40,140,.25);background:#e4ddff}
.bar i{box-shadow:inset 0 3px 3px rgba(255,255,255,.5),0 2px 4px rgba(60,40,140,.3)}
nav{background:linear-gradient(#fff,#efe9ff);box-shadow:0 7px 0 #cbbfff,0 20px 30px rgba(80,60,160,.35),inset 0 2px 0 #fff}
nav .plus{background:radial-gradient(circle at 35% 25%,#b8a6ff,#7c5cff 55%,#34d3c5);box-shadow:0 7px 0 #5238c9,0 16px 22px rgba(82,56,201,.5),inset 0 3px 5px rgba(255,255,255,.6)}
nav .plus:active{transform:translateY(5px);box-shadow:0 2px 0 #5238c9,0 6px 10px rgba(82,56,201,.4)}
.go,.chips button,.seg button,.cats button,.mnav button{box-shadow:0 5px 0 #cbbfff,0 9px 12px rgba(80,60,160,.18);transition:transform .08s,box-shadow .08s}
.go{box-shadow:0 6px 0 #5238c9,0 12px 16px rgba(82,56,201,.35),inset 0 2px 3px rgba(255,255,255,.5)}
.go:active,.chips button:active,.seg button:active,.cats button:active,.mnav button:active{transform:translateY(4px);box-shadow:0 1px 0 #cbbfff}
.chips button.on,.seg button.on{box-shadow:0 5px 0 #5238c9,inset 0 2px 3px rgba(255,255,255,.5)}
.sheet>div{box-shadow:0 -10px 30px rgba(43,35,80,.3),inset 0 3px 0 #fff;background:linear-gradient(#fff,#f4f0ff)}
input[type=number],input[type=text]{box-shadow:inset 0 3px 6px rgba(80,60,160,.15)}
#app{height:100dvh}
nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
nav button{width:100%}
nav .plus{width:58px;justify-self:center}
@media(min-width:700px){#app{max-width:760px}main{padding:28px 48px 130px}#dino{width:300px;height:300px}.top b{font-size:24px}.sheet{align-items:center;justify-content:center}.sheet>div{max-width:440px;border-radius:28px}}
</style>
